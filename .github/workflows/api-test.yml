name: API-Smoke-Test

on:
  pull_request:          
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 1. 秒级启动 JMeter（带插件）
      - name: Run JMeter Smoke
        run: |
          mkdir -p jmeter/report                    # ← 先建文件夹
          docker run --rm -v $PWD:/workspace -w /workspace \
            justb4/jmeter:latest \
            -Jthreads=1 -Jiterations=1 \
            -n -t .github/jmeter-scripts/product-api-test.jmx \
            -l jmeter/result.jtl \
            -e -o jmeter/report

      # 2. 失败自动留证据
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jmeter-smoke-report
          path: jmeter/report/